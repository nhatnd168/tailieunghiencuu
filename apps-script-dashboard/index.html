<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --red:#c0392b; --red-dark:#96281d; --green:#1e8e5a; --amber:#b7791f;
    --ink:#1c2430; --ink-soft:#5b6472; --line:#e4e7ec; --line-soft:#eef0f3;

  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;}
  a{color:inherit;}
  #topbar{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  #topbar h1{font-size:16px;margin:0;white-space:nowrap;}
  #topbar .sub{font-size:12px;color:var(--ink-soft);}
  #topbar .grow{flex:1 1 auto;}
  #globalSearch{width:100%;max-width:340px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;}
  #globalSearchResults{position:absolute;margin-top:4px;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);max-width:340px;max-height:320px;overflow:auto;display:none;z-index:30;}
  #globalSearchResults .gr-item{padding:8px 10px;border-bottom:1px solid var(--line-soft);cursor:pointer;font-size:12.5px;}
  #globalSearchResults .gr-item:hover{background:var(--chip);}
  #globalSearchResults .gr-item b{color:var(--red);}
  .btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;color:var(--ink);}

  .kpi .sub{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}

  .charts-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:14px;margin-bottom:16px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);}

  .card h3 .hint{font-weight:400;color:var(--ink-soft);font-size:11.5px;}

  .table-toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap;}

  .table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);}

  table.dt thead th .arrow{opacity:.5;margin-left:3px;}
  table.dt tbody td{padding:7px 10px;border-bottom:1px solid var(--line-soft);white-space:nowrap;}
  table.dt tbody tr:hover{background:#fafbfc;}
  table.dt td.neg{color:var(--red);}
  table.dt td.name-cell{white-space:normal;min-width:220px;}
  table.dt tr.lvl0 td{font-weight:700;background:#faf8f6;}
  table.dt tr.lvl1 td.name-cell{font-weight:600;}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;}
  .badge.warn{background:#fdf0dc;color:var(--amber);}
  .badge.bad{background:#fbe4e1;color:var(--red);}
  .badge.info{background:#e4eefb;color:#2563a8;}
  .badge.neutral{background:var(--chip);color:var(--ink-soft);}
  .pagination{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-top:10px;font-size:12.5px;color:var(--ink-soft);}
  .pagination button{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:4px 9px;cursor:pointer;}
  .pagination button:disabled{opacity:.4;cursor:default;}
  .section-title{font-size:14px;font-weight:700;margin:22px 0 10px;}
  .section-title:first-child{margin-top:0;}
  #loading{position:fixed;inset:0;background:rgba(244,245,247,.9);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:100;}
  .spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--red);border-radius:50%;animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #errorBanner{display:none;background:#fbe4e1;color:var(--red-dark);padding:10px 20px;font-size:13px;}
  .muted{color:var(--ink-soft);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:760px){.grid2{grid-template-columns:1fr;}}
  .dept-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
  .dept-chips button{border:1px solid var(--line);background:var(--card);padding:5px 11px;border-radius:999px;font-size:12px;cursor:pointer;}
  .dept-chips button.active{background:var(--ink);color:#fff;border-color:var(--ink);}

<script>
// =========================================================================
// Utilities
// =========================================================================
function fmtNum(n){ return Math.round(n||0).toLocaleString('vi-VN'); }
function fmtVND(n){ return fmtNum(n) + ' ₫'; }
function fmtPct(n){ return (n==null) ? '—' : (n*100).toLocaleString('vi-VN',{maximumFractionDigits:1}) + '%'; }
function fmtPctRatio(part, whole){ return whole ? ((part/whole)*100).toLocaleString('vi-VN',{maximumFractionDigits:1})+'%' : '—'; }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function normalize(s){ return String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(); }
function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }
function signClass(n){ return n < 0 ? 'neg' : (n > 0 ? 'pos' : ''); }
const MONTHS12 = Array.from({length:12}, (_,i)=>'Th'+(i+1));

let DATA = null;
const charts = {}; // canvasId -> Chart instance

function upsertChart(canvasId, config){
  const el = document.getElementById(canvasId);
  if (!el) return;
  if (charts[canvasId]) charts[canvasId].destroy();
  charts[canvasId] = new Chart(el.getContext('2d'), config);
}

const COLOR_PLAN = '#94a3b8';
const COLOR_ACTUAL = '#c0392b';
const COLOR_GOOD = '#1e8e5a';
const PALETTE = ['#c0392b','#2563a8','#b7791f','#1e8e5a','#6d5bd0','#0e7490','#9d174d','#4d7c0f'];

function baseChartOpts(extra){
  return Object.assign({
    responsive:true, maintainAspectRatio:false,
    plugins:{ legend:{ position:'bottom', labels:{ boxWidth:12, font:{size:11} } },
      tooltip:{ callbacks:{ label: (ctx)=> `${ctx.dataset.label}: ${fmtVND(ctx.parsed.y ?? ctx.parsed)}` } } },
    scales:{ y:{ ticks:{ callback:(v)=>fmtNum(v) } }, x:{} }
  }, extra || {});
}

// =========================================================================
// Reusable data-table component
// =========================================================================
function createTable(mount, opts){
  const state = { query:'', sortKey: opts.sortKey || null, sortDir: opts.sortDir || -1, page: 1, pageSize: opts.pageSize || 50 };
  let rows = opts.rows || [];

  function cellValue(col, row){ return col.value ? col.value(row) : row[col.key]; }

  function filtered(){
    if (!state.query) return rows;
    const q = normalize(state.query);
    const keys = opts.searchKeys || opts.columns.map(c=>c.key);
    return rows.filter(r => keys.some(k => normalize(r[k]).includes(q)));
  }

  function sorted(list){
    if (!state.sortKey) return list;
    const col = opts.columns.find(c=>c.key===state.sortKey);
    const numeric = col && col.numeric;
    return list.slice().sort((a,b)=>{
      let av = cellValue(col,a), bv = cellValue(col,b);
      if (numeric){ av = av||0; bv = bv||0; return (av-bv)*state.sortDir; }
      av = normalize(av); bv = normalize(bv);
      return av < bv ? -state.sortDir : (av > bv ? state.sortDir : 0);
    });
  }

  function render(){
    const all = sorted(filtered());
    const totalPages = Math.max(1, Math.ceil(all.length / state.pageSize));
    state.page = Math.min(state.page, totalPages);
    const pageRows = opts.paginate === false ? all : all.slice((state.page-1)*state.pageSize, state.page*state.pageSize);

    const toolbar = opts.searchable === false ? '' : `
      <div class="table-toolbar">
        <input type="search" placeholder="${opts.searchPlaceholder || 'Tìm kiếm…'}" value="${escapeHtml(state.query)}"/>
        <span class="count">${all.length.toLocaleString('vi-VN')} dòng${opts.extraCount ? ' · ' + opts.extraCount(all) : ''}</span>
      </div>`;

    const thead = `<thead><tr>${opts.columns.map(c=>{
      const arrow = state.sortKey===c.key ? `<span class="arrow">${state.sortDir===1?'▲':'▼'}</span>` : '';
      return `<th class="${c.numeric?'num':''}" data-key="${c.key}">${c.label}${c.sortable===false?'':arrow}</th>`;
    }).join('')}</tr></thead>`;

    const tbody = `<tbody>${pageRows.map(r=>{
      const cls = opts.rowClass ? opts.rowClass(r) : '';
      return `<tr class="${cls}">${opts.columns.map(c=>{
        const raw = cellValue(c, r);
        const val = c.render ? c.render(r) : (c.numeric ? fmtVND(raw) : escapeHtml(raw));
        const negCls = c.numeric && (raw||0) < 0 ? 'neg' : '';
        return `<td class="${c.numeric?'num':''} ${negCls} ${c.nameCell?'name-cell':''}">${val}</td>`;
      }).join('')}</tr>`;
    }).join('') || `<tr><td colspan="${opts.columns.length}" class="muted" style="text-align:center;padding:20px;">Không có dữ liệu phù hợp</td></tr>`}</tbody>`;

    const pagination = (opts.paginate === false || all.length <= state.pageSize) ? '' : `
      <div class="pagination">
        <span>Trang ${state.page}/${totalPages}</span>
        <button data-act="prev" ${state.page<=1?'disabled':''}>‹ Trước</button>
        <button data-act="next" ${state.page>=totalPages?'disabled':''}>Sau ›</button>
      </div>`;

    mount.innerHTML = `${toolbar}<div class="table-scroll"><table class="dt">${thead}${tbody}</table></div>${pagination}`;

    if (opts.searchable !== false){
      mount.querySelector('input[type=search]').addEventListener('input', debounce(e=>{
        state.query = e.target.value; state.page = 1; render();
      }, 180));
    }
    mount.querySelectorAll('thead th[data-key]').forEach(th=>{
      const col = opts.columns.find(c=>c.key===th.dataset.key);
      if (col && col.sortable===false) return;
      th.addEventListener('click', ()=>{
        if (state.sortKey === th.dataset.key) state.sortDir *= -1;
        else { state.sortKey = th.dataset.key; state.sortDir = col && col.numeric ? -1 : 1; }
        render();
      });
    });
    const prev = mount.querySelector('[data-act=prev]'), next = mount.querySelector('[data-act=next]');
    if (prev) prev.addEventListener('click', ()=>{ state.page--; render(); });
    if (next) next.addEventListener('click', ()=>{ state.page++; render(); });
  }

  render();
  return { setRows(r){ rows = r; state.page = 1; render(); }, reset(){ state.query=''; state.page=1; render(); } };
}

function kpiCard(label, value, sub, cls){
  return `<div class="kpi"><div class="label">${label}</div><div class="value ${cls||''}">${value}</div>${sub?`<div class="sub">${sub}</div>`:''}</div>`;
}

// =========================================================================
// Tabs
// =========================================================================
const TABS = [];
function registerTab(id, label, buildFn){ TABS.push({id, label, buildFn}); }

function initTabs(){
  const nav = document.getElementById('tabs');
  const views = document.getElementById('views');
  TABS.forEach((t, i)=>{
    const btn = document.createElement('button');
    btn.textContent = t.label; btn.dataset.tab = t.id;
    if (i===0) btn.classList.add('active');
    btn.addEventListener('click', ()=> activateTab(t.id));
    nav.appendChild(btn);

    const view = document.createElement('section');
    view.className = 'view' + (i===0 ? ' active' : '');
    view.id = 'view-' + t.id;
    views.appendChild(view);
  });
}
function activateTab(id){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active', b.dataset.tab===id));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active', v.id === 'view-'+id));
  window.scrollTo({top:0});
}

// =========================================================================
// Data-model helpers
// =========================================================================
function getSection(report, code){ return report && report.sections.find(s=>s.code===code); }
function getItem(section, tt){ return section && section.rows.find(r => r.tt===tt); }
function sumRows(rows){ return rows.reduce((a,r)=>a+(r.tong||r.total||0), 0); }

// =========================================================================
// TAB: Tổng quan
// =========================================================================
registerTab('overview', 'Tổng quan', function(root){
  const pnl = DATA.pnl;
  const kh = getSection(pnl, 'A'), th = getSection(pnl, 'B');
  const dtKH = getItem(kh, 1), dtTH = getItem(th, 1);
  const cpKH = getItem(kh, 4), cpTH = getItem(th, 4);
  const lnKH = getItem(kh, 10), lnTH = getItem(th, 10);

  const kmpTotal = DATA.kmp && DATA.kmp.grandTotal;
  const backlogTK = DATA.hopDongTonTK.reduce((a,x)=>a+x.conPhaiThu,0);
  const backlogTC = DATA.hopDongTonTC.reduce((a,x)=>a+x.conPhaiThu,0);

  root.innerHTML = `
    <div class="kpis">
      ${kpiCard('Doanh thu thuần — Kế hoạch năm', fmtVND(dtKH?dtKH.total:0))}
      ${kpiCard('Doanh thu thuần — Thực hiện', fmtVND(dtTH?dtTH.total:0), 'Hoàn thành ' + fmtPctRatio(dtTH?dtTH.total:0, dtKH?dtKH.total:0) + ' kế hoạch năm')}
      ${kpiCard('Chi phí — Kế hoạch / Thực hiện', fmtVND(cpTH?cpTH.total:0), 'Kế hoạch: ' + fmtVND(cpKH?cpKH.total:0))}
      ${kpiCard('Tổng lợi nhuận — Thực hiện', fmtVND(lnTH?lnTH.total:0), 'Kế hoạch: ' + fmtVND(lnKH?lnKH.total:0), signClass(lnTH?lnTH.total:0))}
      ${kpiCard('Giá trị hợp đồng tồn — còn phải thu', fmtVND(backlogTK+backlogTC), `Thiết kế ${fmtVND(backlogTK)} · Thi công ${fmtVND(backlogTC)}`)}
      ${kpiCard('Chi phí quản lý/bán hàng (KMP) — Thực hiện lũy kế', kmpTotal?fmtVND(kmpTotal.tong):'—', kmpTotal&&DATA.kmp?(DATA.kmp.keHoachLabel+': '+fmtVND(kmpTotal.keHoach)):'')}
    </div>
    <div class="charts-row">
      <div class="card"><h3>Doanh thu thuần theo kỳ <span class="hint">Kế hoạch vs Thực hiện</span></h3><div class="chart-wrap"><canvas id="chOvRevenue"></canvas></div></div>
      <div class="card"><h3>Tổng lợi nhuận theo kỳ <span class="hint">Kế hoạch vs Thực hiện</span></h3><div class="chart-wrap"><canvas id="chOvProfit"></canvas></div></div>
    </div>
    <div class="charts-row">
      <div class="card"><h3>Cơ cấu chi phí kế hoạch <span class="hint">theo nhóm KMP</span></h3><div class="chart-wrap"><canvas id="chOvCostMix"></canvas></div></div>
      <div class="card"><h3>Tiến độ ghi nhận doanh thu hợp đồng tồn <span class="hint">theo tháng, kế hoạch</span></h3><div class="chart-wrap"><canvas id="chOvBacklog"></canvas></div></div>
    </div>
  `;

  upsertChart('chOvRevenue', { type:'bar', data:{ labels: pnl.valueLabels, datasets:[
    { label:'Kế hoạch', data: dtKH?dtKH.values:[0,0,0,0], backgroundColor: COLOR_PLAN },
    { label:'Thực hiện', data: dtTH?dtTH.values:[0,0,0,0], backgroundColor: COLOR_ACTUAL } ]},
    options: baseChartOpts() });

  upsertChart('chOvProfit', { type:'bar', data:{ labels: pnl.valueLabels, datasets:[
    { label:'Kế hoạch', data: lnKH?lnKH.values:[0,0,0,0], backgroundColor: COLOR_PLAN },
    { label:'Thực hiện', data: lnTH?lnTH.values:[0,0,0,0], backgroundColor: COLOR_GOOD } ]},
    options: baseChartOpts() });

  const groupRows = (DATA.kmp ? DATA.kmp.rows.filter(r=>r.level===0) : []);
  upsertChart('chOvCostMix', { type:'doughnut', data:{ labels: groupRows.map(r=>r.tenPhi), datasets:[
    { data: groupRows.map(r=>r.keHoach), backgroundColor: PALETTE } ]},
    options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{position:'right', labels:{boxWidth:10,font:{size:10.5}}},
      tooltip:{ callbacks:{ label:(ctx)=> `${ctx.label}: ${fmtVND(ctx.parsed)}` } } } } });

  const th12 = DATA.hopDongTonTongHop;
  const khSection = th12 && th12.sections[0], thSection2 = th12 && th12.sections[1];
  upsertChart('chOvBacklog', { type:'bar', data:{ labels: th12?th12.monthLabels:MONTHS12, datasets:[
    { label:'Kế hoạch', data: khSection&&khSection.total ? khSection.total.months : [], backgroundColor: COLOR_PLAN },
    { label:'Thực hiện', data: thSection2&&thSection2.total ? thSection2.total.months : [], backgroundColor: COLOR_ACTUAL } ]},
    options: baseChartOpts() });
});

// =========================================================================
// TAB: KQKD (P&L) + Sản lượng & Lương  (shared renderer — identical shape)
// =========================================================================
function renderQuarterlyReport(root, report, opts){
  opts = opts || {};
  if (!report){ root.innerHTML = '<p class="muted">Không có dữ liệu.</p>'; return; }
  let activeCode = report.sections[0].code;
  // root.id is unique per tab (view-pnl / view-sl-luong); scope element ids
  // to it so this shared renderer never collides across the two callers.
  const canvasId = root.id + '-chQR';
  const mountId = root.id + '-qrTableMount';

  function draw(){
    const section = getSection(report, activeCode);
    const highlightTTs = opts.highlightTTs || [];
    const highlighted = section.rows.filter(r => highlightTTs.includes(r.tt));

    root.innerHTML = `
      <div class="subtabs">${report.sections.map(s=>`<button data-code="${s.code}" class="${s.code===activeCode?'active':''}">${s.title}</button>`).join('')}</div>
      <div class="charts-row"><div class="card" style="grid-column:1/-1;"><h3>${section.title} — chỉ tiêu chính theo quý</h3><div class="chart-wrap"><canvas id="${canvasId}"></canvas></div></div></div>
      <div class="table-scroll" id="${mountId}"></div>
    `;
    root.querySelectorAll('.subtabs button').forEach(b=> b.addEventListener('click', ()=>{ activeCode = b.dataset.code; draw(); }));

    upsertChart(canvasId, { type:'bar', data:{ labels: report.valueLabels, datasets: highlighted.map((r,i)=>({
      label: r.name, data: r.values, backgroundColor: PALETTE[i % PALETTE.length] })) },
      options: baseChartOpts() });

    const mount = document.getElementById(mountId);
    createTable(mount, {
      rows: section.rows,
      searchable: true, paginate: true, pageSize: 100,
      searchPlaceholder: 'Tìm chỉ tiêu…',
      searchKeys: ['name'],
      rowClass: r => 'lvl' + r.indent,
      columns: [
        { key:'tt', label:'TT', numeric:false, render: r => escapeHtml(r.tt==null?'':r.tt) },
        { key:'name', label: report.nameLabel || 'Chỉ tiêu', nameCell:true, render: r => `<span style="padding-left:${r.indent*16}px;display:inline-block;">${escapeHtml(r.name)}</span>` },
        ...report.valueLabels.map((lbl,i)=>({ key:'v'+i, label: lbl, numeric:true, value: r => r.values[i], render: r => fmtVND(r.values[i]) })),
        { key:'total', label: report.totalLabel, numeric:true },
        { key:'ratio', label:'Tỷ lệ/DT', numeric:false, render: r => fmtPct(r.ratio), sortable:false }
      ]
    });
  }
  draw();
}

registerTab('backlog', 'Hợp đồng tồn', function(root){
  root.innerHTML = `
    <div class="subtabs">
      <button data-v="tonghop" class="active">Tổng hợp kế hoạch ghi nhận DT</button>
      <button data-v="tk">Chi tiết — Hợp đồng thiết kế</button>
      <button data-v="tc">Chi tiết — Hợp đồng thi công</button>
    </div>
    <div id="backlogBody"></div>
  `;
  const body = document.getElementById('backlogBody');

  root.querySelectorAll('.subtabs button').forEach(b=> b.addEventListener('click', ()=>{
    root.querySelectorAll('.subtabs button').forEach(x=>x.classList.toggle('active', x===b));
    view = b.dataset.v; draw();
  }));

  function draw(){
    if (view === 'tonghop') return drawTongHop();
    return drawChiTiet(view === 'tk' ? DATA.hopDongTonTK : DATA.hopDongTonTC, view);
  }

  function drawTongHop(){
    const d = DATA.hopDongTonTongHop;
    if (!d){ body.innerHTML = '<p class="muted">Không có dữ liệu.</p>'; return; }
    body.innerHTML = `
      <div class="charts-row"><div class="card" style="grid-column:1/-1;"><h3>Ghi nhận doanh thu hợp đồng tồn theo tháng</h3><div class="chart-wrap"><canvas id="chBacklogMonth"></canvas></div></div></div>
      <div class="grid2">
        ${d.sections.map((s,i)=>`
          <div class="card"><h3>${s.title}</h3>
            <div class="table-scroll"><table class="dt"><thead><tr><th>Loại HĐ</th>${d.monthLabels.map(m=>`<th class="num">${m}</th>`).join('')}<th class="num">Tổng</th></tr></thead>
            <tbody>${s.rows.map(r=>`<tr><td class="name-cell">${escapeHtml(r.name)}</td>${r.months.map(v=>`<td class="num ${v<0?'neg':''}">${fmtNum(v)}</td>`).join('')}<td class="num">${fmtVND(r.total)}</td></tr>`).join('')}
            ${s.total ? `<tr class="lvl0"><td class="name-cell">Tổng</td>${s.total.months.map(v=>`<td class="num">${fmtNum(v)}</td>`).join('')}<td class="num">${fmtVND(s.total.total)}</td></tr>` : ''}
            </tbody></table></div>
          </div>`).join('')}
      </div>`;
    const kh = d.sections[0], th = d.sections[1];
    upsertChart('chBacklogMonth', { type:'bar', data:{ labels: d.monthLabels, datasets:[
      { label:'Kế hoạch', data: kh&&kh.total?kh.total.months:[], backgroundColor: COLOR_PLAN },
      { label:'Thực hiện', data: th&&th.total?th.total.months:[], backgroundColor: COLOR_ACTUAL } ]},
      options: baseChartOpts() });
  }

  function noteBadge(note){
    if (!note) return '';
    const n = note.toLowerCase();
    if (n.includes('vướng')) return `<span class="badge bad">${escapeHtml(note)}</span>`;
    if (n.includes('bảo lưu')) return `<span class="badge warn">${escapeHtml(note)}</span>`;
    if (n.includes('thanh lý')) return `<span class="badge neutral">${escapeHtml(note)}</span>`;
    return `<span class="badge info">${escapeHtml(note)}</span>`;
  }

  function drawChiTiet(items, key){
    const totalHD = items.reduce((a,x)=>a+x.giaTriHopDong,0);
    const totalPaid = items.reduce((a,x)=>a+x.daThanhToan,0);
    const totalRemain = items.reduce((a,x)=>a+x.conPhaiThu,0);
    const totalExpected = items.reduce((a,x)=>a+x.duKienGhiNhan,0);

    body.innerHTML = `
      <div class="kpis">
        ${kpiCard('Tổng giá trị hợp đồng', fmtVND(totalHD), items.length + ' dự án')}
        ${kpiCard('Đã thanh toán', fmtVND(totalPaid), fmtPctRatio(totalPaid,totalHD)+' giá trị HĐ')}
        ${kpiCard('Còn phải thu theo HĐ', fmtVND(totalRemain))}
        ${kpiCard('Dự kiến ghi nhận DT', fmtVND(totalExpected))}
      </div>
      <div id="backlogTableMount"></div>`;

    createTable(document.getElementById('backlogTableMount'), {

      sortKey:'conPhaiThu',
      columns: [
        { key:'stt', label:'STT', numeric:true },
        { key:'maDuAn', label:'Mã dự án' },
        { key:'tenDuAn', label:'Tên dự án', nameCell:true },
        { key:'giaTriHopDong', label:'Giá trị HĐ', numeric:true },
        { key:'daThanhToan', label:'Đã thanh toán', numeric:true },
        { key:'conPhaiThu', label:'Còn phải thu', numeric:true },
        { key:'daGhiNhan', label:'Đã ghi nhận DT', numeric:true },
        { key:'duKienGhiNhan', label:'DT dự kiến ghi nhận', numeric:true },
        { key:'thangGhiNhan', label:'Tháng GN' },
        { key:'note', label:'Ghi chú', render: r => noteBadge(r.note), sortable:false }
      ]
    });
  }
  draw();
});

function buildSearchIndex(){
  const idx = [];
  (DATA.hopDongTonTK||[]).forEach(x => idx.push({ tab:'backlog', label: x.tenDuAn, sub:'HĐ tồn — Thiết kế · '+x.maDuAn, text: x.maDuAn+' '+x.tenDuAn }));
  (DATA.hopDongTonTC||[]).forEach(x => idx.push({ tab:'backlog', label: x.tenDuAn, sub:'HĐ tồn — Thi công · '+x.maDuAn, text: x.maDuAn+' '+x.tenDuAn }));
  (DATA.kmp?DATA.kmp.rows:[]).forEach(x => idx.push({ tab:'costs', label: x.tenPhi, sub:'KMP · '+x.maPhi, text: x.maPhi+' '+x.tenPhi }));
  (DATA.cp||[]).forEach(x => idx.push({ tab:'costs', label: x.tenPhi, sub:'CP kế toán · '+x.maPhi, text: x.maPhi+' '+x.tenPhi }));
  (DATA.khauHao||[]).forEach(x => idx.push({ tab:'khauhao', label: x.tenCC, sub:'Khấu hao · '+x.maCC, text: x.maCC+' '+x.tenCC }));
  if (DATA.pnl) DATA.pnl.sections.forEach(s => s.rows.forEach(r => idx.push({ tab:'pnl', label: r.name, sub:'P&L · '+s.title, text: r.name })));
  return idx;
}
function initGlobalSearch(){
  const input = document.getElementById('globalSearch');
  const box = document.getElementById('globalSearchResults');
  const index = buildSearchIndex();
  input.addEventListener('input', debounce(()=>{
    const q = normalize(input.value.trim());
    if (q.length < 2){ box.style.display='none'; return; }
    const matches = index.filter(x => normalize(x.text).includes(q)).slice(0, 20);
    box.innerHTML = matches.length
      ? matches.map(m => `<div class="gr-item" data-tab="${m.tab}"><div>${escapeHtml(m.label)}</div><div class="muted">${escapeHtml(m.sub)}</div></div>`).join('')
      : `<div class="gr-item muted">Không tìm thấy kết quả</div>`;
    box.style.display = 'block';
    box.querySelectorAll('.gr-item[data-tab]').forEach(el => el.addEventListener('click', ()=>{
      activateTab(el.dataset.tab); box.style.display='none'; input.value='';
    }));
  }, 150));
  document.addEventListener('click', (e)=>{ if (!e.target.closest('#globalSearch') && !e.target.closest('#globalSearchResults')) box.style.display='none'; });
}

// =========================================================================
// Boot
// =========================================================================
// TABS is populated once, at script-parse time, by the registerTab() calls
// above. A refresh just needs a clean DOM and to re-run each builder
// against the freshly-fetched DATA — the tab registry itself never changes.
function renderAll(){
  document.getElementById('views').innerHTML = '';
  document.getElementById('tabs').innerHTML = '';
  Object.keys(charts).forEach(id => { charts[id].destroy(); delete charts[id]; });
  initTabs();
  TABS.forEach(t => t.buildFn(document.getElementById('view-'+t.id)));
  initGlobalSearch();
}

function loadData(){
  document.getElementById('loading').style.display = 'flex';
  document.getElementById('errorBanner').style.display = 'none';
  google.script.run
    .withSuccessHandler(function(data){
      DATA = data;
      document.getElementById('metaLine').textContent =
        data.meta.name + ' · cập nhật lúc ' + new Date(data.meta.generatedAt).toLocaleString('vi-VN');
      renderAll();
      document.getElementById('loading').style.display = 'none';
    })
    .withFailureHandler(function(err){
      document.getElementById('loading').style.display = 'none';
      const banner = document.getElementById('errorBanner');
      banner.textContent = 'Lỗi tải dữ liệu: ' + (err && err.message ? err.message : err);
      banner.style.display = 'block';
    })
    .getDashboardData();
}

document.getElementById('refreshBtn').addEventListener('click', loadData);
document.getElementById('clearFiltersBtn').addEventListener('click', ()=> renderAll());
loadData();
</script>
